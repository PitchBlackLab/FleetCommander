<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fleet Commander - 3D Voxel Board</title>
    <style>
        :root {
            --bg-color: #01060f; --hud-color: #00f0ff;
            --lead-color: #ff0055; --escort-color: #00ff66;
            --grid-color: rgba(0, 240, 255, 0.04); --panel-bg: rgba(2, 12, 30, 0.95);
        }
        body {
            margin: 0; padding: 0; background-color: var(--bg-color);
            color: var(--hud-color); font-family: 'Courier New', Courier, monospace;
            overflow: hidden; display: flex;
        }
        #control-panel {
            position: absolute; top: 15px; left: 15px; width: 280px;
            background: var(--panel-bg); padding: 15px;
            border: 1px solid var(--hud-color); border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); z-index: 100;
        }
        h2 { margin: 0 0 10px 0; font-size: 13px; color: var(--lead-color); letter-spacing: 1px; }
        .stat { font-size: 11px; margin: 5px 0; color: #fff; }
        .panel-section { border-top: 1px solid rgba(0, 240, 255, 0.2); margin-top: 10px; padding-top: 10px; }
        .btn-container { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
        button {
            background: #041a3a; border: 1px solid var(--hud-color); color: var(--hud-color);
            padding: 5px; cursor: pointer; font-family: monospace; font-size: 10px;
            text-transform: uppercase; border-radius: 2px;
        }
        button:hover { background: var(--hud-color); color: var(--bg-color); font-weight: bold; }
        .save-box { display: flex; gap: 4px; margin-top: 5px; }
        input[type="text"], select, input[type="color"] {
            background: #010b18; border: 1px solid rgba(0, 240, 255, 0.4);
            color: #fff; padding: 3px; font-family: monospace; font-size: 10px; width: 100%; box-sizing: border-box;
        }
        .color-row { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; font-size: 10px; }
        #viewport-wrapper { display: flex; width: 100vw; height: 100vh; position: relative; }
        #canvas-3d { width: 100% !important; height: 100% !important; display: block; position: absolute; top: 0; left: 0; z-index: 1; }
        #mini-maps-sidebar {
            position: absolute; top: 15px; right: 15px; display: flex;
            flex-direction: column; gap: 10px; z-index: 50; pointer-events: none;
            max-height: 98vh; overflow-y: auto; padding-right: 5px;
        }
        .mini-outer { display: flex; flex-direction: column; align-items: center; pointer-events: auto; }
        .mini-title { font-size: 10px; font-weight: bold; color: var(--lead-color); margin-bottom: 2px; }
        .mini-grid-container {
            display: grid; grid-template-columns: auto auto auto; align-items: center; justify-items: center;
            background: var(--panel-bg); border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 4px; padding: 4px;
        }
        .label-text { font-size: 9px; color: #888; font-weight: bold; width: 32px; text-align: center; }
        .mini-canvas { background: #020914; display: block; width: 150px; height: 100px; border-radius: 2px; }
        .cam-btn-grid { display: grid; grid-template-columns: 1fr; gap: 4px; margin-top: 5px; width: 150px; }
    </style>
</head>
<body>

    <div id="control-panel">
        <h2>3D TACTICAL BOARD</h2>
        <div class="stat">ARRANGEMENT: <span id="ui-formation" style="color:var(--hud-color);">LOADING...</span></div>
        <div class="stat">SHIPS LINKED: <span id="ui-count">0</span></div>
        
        <div class="panel-section" id="ship-editor" style="display:none; border: 1px dashed var(--hud-color); padding: 8px; border-radius:4px;">
            <div class="stat" style="color:var(--lead-color); font-weight:bold; margin-top:0;">EDIT SHIP: <span id="edit-callsign"></span></div>
            <div style="margin: 4px 0;"><span class="stat">HULL NAME:</span><input type="text" id="edit-name"></div>
            <div style="margin: 4px 0;"><span class="stat">SIZE CLASS:</span>
                <select id="edit-size"><option value="SMALL">SMALL (10m Box)</option><option value="MEDIUM">MEDIUM (30m Box)</option><option value="LARGE">LARGE (50m Box)</option></select>
            </div>
            <div style="margin: 4px 0;"><span class="stat">WIRE SHAPE:</span>
                <select id="edit-shape"><option value="BOX">BLOCK VOXEL</option><option value="WEDGE">CAPITAL WEDGE</option><option value="ARROW">FIGHTER SHAPE</option></select>
            </div>
            <button style="width:100%; margin-top:4px;" onclick="saveSelectedShipConfig()">UPDATE REGISTRY</button>
        </div>

        <div class="panel-section">
            <div class="stat" style="color: var(--lead-color); font-weight: bold;">PRESETS:</div>
            <div id="formation-buttons" class="btn-container"></div>
        </div>

        <div class="panel-section">
            <div class="stat" style="color: var(--lead-color); font-weight: bold;">SAVE MATRIX:</div>
            <div class="save-box">
                <input type="text" id="custom-name-input" placeholder="MATRIX_TAG" value="Alpha-3D-Matrix">
                <button onclick="commitCustomFormation()">SAVE</button>
            </div>
        </div>

        <div class="panel-section">
            <div class="stat" style="color: var(--lead-color); font-weight: bold;">COLOR SPECS CONFIG:</div>
            <div class="color-row"><span>HUD Interface:</span><input type="color" id="cfg-hud" value="#00f0ff" onchange="updateThemeStyle()"></div>
            <div class="color-row"><span>Lead Capital:</span><input type="color" id="cfg-lead" value="#ff0055" onchange="updateThemeStyle()"></div>
            <div class="color-row"><span>Escort Fleet:</span><input type="color" id="cfg-escort" value="#00ff66" onchange="updateThemeStyle()"></div>
            <div class="color-row"><span>Radar Grid:</span><input type="color" id="cfg-grid" value="#1a3d54" onchange="updateThemeStyle()"></div>
            <div class="color-row"><span>Background:</span><input type="color" id="cfg-bg" value="#01060f" onchange="updateThemeStyle()"></div>
        </div>
    </div>

    <div id="viewport-wrapper">
        <canvas id="canvas-3d"></canvas>

         <div id="mini-maps-sidebar">
            <!-- 1) DECK VIEW (X / Y) -->
            <div class="mini-outer">
                <button class="mini-title" onclick="snapCameraAngle(0.0, -1.57)">DECK VIEW (X / Y)</button>
                <div class="mini-grid-container">
                    <div></div><div class="label-text">FORE</div><div></div>
                    <div class="label-text">PORT</div><canvas id="map-xy" class="mini-canvas" width="150" height="100"></canvas><div class="label-text">STBD</div>
                    <div></div><div class="label-text">AFT</div><div></div>
                </div>
            </div>

            <!-- 2) AFT VIEW (X / Z) -->
            <div class="mini-outer">
                <button class="mini-title" onclick="snapCameraAngle(0.0, 0.0)">AFT VIEW (X / Z)</button>
                <div class="mini-grid-container">
                    <div></div><div class="label-text">DECK</div><div></div>
                    <div class="label-text">PORT</div><canvas id="map-xz" class="mini-canvas" width="150" height="100"></canvas><div class="label-text">STBD</div>
                    <div></div><div class="label-text">KEEL</div><div></div>
                </div>
            </div>

            <!-- 3) STBD VIEW (Y / Z) -->
            <div class="mini-outer">
                <button class="mini-title" onclick="snapCameraAngle(-1.57, 0.0)">STBD VIEW (Y / Z)</button>
                <div class="mini-grid-container">
                    <div></div><div class="label-text">DECK</div><div></div>
                    <div class="label-text">FORE</div><canvas id="map-yz" class="mini-canvas" width="150" height="100"></canvas><div class="label-text">AFT</div>
                    <div></div><div class="label-text">KEEL</div><div></div>
                </div>
            </div>

            <!-- 4) CAMERA TRACTOR CONSOLE -->
            <div class="mini-outer">
                <div class="mini-title" style="pointer-events:none;">3D CAM CONSOLE</div>
                <div class="mini-grid-container" style="display:flex; flex-direction:column; padding:4px;">
                    <canvas id="map-cam" class="mini-canvas" width="150" height="30"></canvas>
                </div>
            </div>
        </div>
    </div>
    <script>
        const ws = new WebSocket("ws://" + window.location.hostname + ":8081");
        
        const canvas3D = document.getElementById('canvas-3d');
        const ctx3D = canvas3D.getContext('2d');
        
        const mXY = document.getElementById('map-xy'); const ctxXY = mXY.getContext('2d');
        const mYZ = document.getElementById('map-yz'); const ctxYZ = mYZ.getContext('2d');
        const mXZ = document.getElementById('map-xz'); const ctxXZ = mXZ.getContext('2d');
        const mCam = document.getElementById('map-cam'); const ctxCam = mCam.getContext('2d');

        let fleetAssignments = {};
        let targetAssignments = {};
        let activeFormation = "N/A";
        let selectedToken = null;
        let activeAxisMode = null;
        let editingCallsign = null;

        // Matches requested default looks: Yaw = 0.10, Pitch = -0.10
        let camYaw = 0.10; 
        let camPitch = -0.10;
        let isDraggingCam = false;
        let lastMousePos = { x: 0, y: 0 };

        const ORTHO_SCALE = 0.5;

        function updateThemeStyle() {
            const r = document.documentElement.style;
            const hudVal = document.getElementById('cfg-hud').value;
            const leadVal = document.getElementById('cfg-lead').value;
            const escortVal = document.getElementById('cfg-escort').value;
            const gridHex = document.getElementById('cfg-grid').value;
            const bgVal = document.getElementById('cfg-bg').value;

            r.setProperty('--hud-color', hudVal);
            r.setProperty('--lead-color', leadVal);
            r.setProperty('--escort-color', escortVal);
            r.setProperty('--bg-color', bgVal);
            
            const bigInt = parseInt(gridHex.slice(1), 16);
            const rVal = (bigInt >> 16) & 255; const gVal = (bigInt >> 8) & 255; const bVal = bigInt & 255;
            r.setProperty('--grid-color', "rgba(" + rVal + "," + gVal + "," + bVal + ", 0.08)");

            ws.send(JSON.stringify({
                type: "SAVE_THEME_CONFIG",
                colors: { hud: hudVal, lead: leadVal, escort: escortVal, grid: gridHex, bg: bgVal }
            }));
        }

        function snapCameraAngle(yaw, pitch) {
            camYaw = yaw;
            camPitch = pitch;
        }

        function initViewports() {
            canvas3D.width = window.innerWidth;
            canvas3D.height = window.innerHeight;
        }
        window.addEventListener('resize', initViewports);
        initViewports();
        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "SYNC_ALL") {
                activeFormation = data.formation;
                targetAssignments = data.assignments;
                document.getElementById('ui-formation').innerText = activeFormation;
                
                for (const [callsign, targetData] of Object.entries(data.assignments)) {
                    if (!fleetAssignments[callsign]) {
                        fleetAssignments[callsign] = JSON.parse(JSON.stringify(targetData));
                    } else {
                        fleetAssignments[callsign].ship = targetData.ship;
                        fleetAssignments[callsign].size = targetData.size;
                        fleetAssignments[callsign].shape = targetData.shape;
                    }
                }

                if (data.colors) {
                    const c = data.colors;
                    document.getElementById('cfg-hud').value = c.hud;
                    document.getElementById('cfg-lead').value = c.lead;
                    document.getElementById('cfg-escort').value = c.escort;
                    document.getElementById('cfg-grid').value = c.grid;
                    document.getElementById('cfg-bg').value = c.bg;
                    
                    const r = document.documentElement.style;
                    r.setProperty('--hud-color', c.hud); r.setProperty('--lead-color', c.lead);
                    r.setProperty('--escort-color', c.escort); r.setProperty('--bg-color', c.bg);
                    const bigInt = parseInt(c.grid.slice(1), 16);
                    const rVal = (bigInt >> 16) & 255; const gVal = (bigInt >> 8) & 255; const bVal = bigInt & 255;
                    r.setProperty('--grid-color', "rgba(" + rVal + "," + gVal + "," + bVal + ", 0.08)");
                }

                if (data.formationList) {
                    const btnContainer = document.getElementById('formation-buttons');
                    btnContainer.innerHTML = "";
                    data.formationList.forEach(name => {
                        const btn = document.createElement('button');
                        btn.innerText = name.replace('-', ' ');
                        btn.onclick = () => { ws.send(JSON.stringify({ type: "SELECT_FORMATION", name: name })); };
                        btnContainer.appendChild(btn);
                    });
                }
            } else if (data.type === "FORMATION_SHIFT") {
                targetAssignments = data.assignments;
                for (const [callsign, targetData] of Object.entries(data.assignments)) {
                    if (fleetAssignments[callsign]) {
                        fleetAssignments[callsign].ship = targetData.ship;
                        fleetAssignments[callsign].size = targetData.size;
                        fleetAssignments[callsign].shape = targetData.shape;
                    }
                }
                if (editingCallsign && fleetAssignments[editingCallsign]) {
                    showShipEditor(editingCallsign);
                }
            } else if (data.type === "THEME_UPDATED") {
                const c = data.colors;
                document.getElementById('cfg-hud').value = c.hud;
                document.getElementById('cfg-lead').value = c.lead;
                document.getElementById('cfg-escort').value = c.escort;
                document.getElementById('cfg-grid').value = c.grid;
                document.getElementById('cfg-bg').value = c.bg;
                
                const r = document.documentElement.style;
                r.setProperty('--hud-color', c.hud); r.setProperty('--lead-color', c.lead);
                r.setProperty('--escort-color', c.escort); r.setProperty('--bg-color', c.bg);
                const bigInt = parseInt(c.grid.slice(1), 16);
                const rVal = (bigInt >> 16) & 255; const gVal = (bigInt >> 8) & 255; const bVal = bigInt & 255;
                r.setProperty('--grid-color', "rgba(" + rVal + "," + gVal + "," + bVal + ", 0.08)");
            }
        };

        function commitCustomFormation() {
            const tag = document.getElementById('custom-name-input').value.trim().replace(/\s+/g, '-');
            if(tag) ws.send(JSON.stringify({ type: "SAVE_FORMATION", name: tag }));
        }

        function showShipEditor(callsign) {
            editingCallsign = callsign;
            const ship = fleetAssignments[callsign];
            document.getElementById('edit-callsign').innerText = callsign;
            document.getElementById('edit-name').value = ship.ship;
            document.getElementById('edit-size').value = ship.size || "MEDIUM";
            document.getElementById('edit-shape').value = ship.shape || "BOX";
            document.getElementById('ship-editor').style.display = "block";
        }

        function saveSelectedShipConfig() {
            if (!editingCallsign) return;
            ws.send(JSON.stringify({
                type: "UPDATE_SHIP_CONFIG",
                callsign: editingCallsign,
                name: document.getElementById('edit-name').value,
                size: document.getElementById('edit-size').value,
                shape: document.getElementById('edit-shape').value
            }));
        }
        function handleMiniMouseDown(e, canvasEl, axis1, axis2, inv1, inv2) {
            const rect = canvasEl.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const midX = canvasEl.width / 2;
            const midY = canvasEl.height / 2;

            for (const [callsign, data] of Object.entries(fleetAssignments)) {
                const val1 = inv1 ? -data[axis1] : data[axis1];
                const val2 = inv2 ? -data[axis2] : data[axis2];
                const posX = midX + (val1 * ORTHO_SCALE);
                const posY = midY + (val2 * ORTHO_SCALE);
                
                if (Math.hypot(mouseX - posX, mouseY - posY) < 12) {
                    selectedToken = callsign;
                    activeAxisMode = { c: canvasEl, a1: axis1, a2: axis2, i1: inv1, i2: inv2 };
                    showShipEditor(callsign);
                    break;
                }
            }
        }

        function trackMouseMoves(e) {
            if (selectedToken && activeAxisMode) {
                const rect = activeAxisMode.c.getBoundingClientRect();
                const midX = activeAxisMode.c.width / 2;
                const midY = activeAxisMode.c.height / 2;
                
                let rawVal1 = ((e.clientX - rect.left) - midX) / ORTHO_SCALE;
                let rawVal2 = ((e.clientY - rect.top) - midY) / ORTHO_SCALE;

                if (activeAxisMode.i1) rawVal1 = -rawVal1;
                if (activeAxisMode.i2) rawVal2 = -rawVal2;

                const snapVal1 = Math.round(rawVal1 / 10) * 10;
                const snapVal2 = Math.round(rawVal2 / 10) * 10;

                fleetAssignments[selectedToken][activeAxisMode.a1] = snapVal1;
                fleetAssignments[selectedToken][activeAxisMode.a2] = snapVal2;
                targetAssignments[selectedToken][activeAxisMode.a1] = snapVal1;
                targetAssignments[selectedToken][activeAxisMode.a2] = snapVal2;

                let msg = { type: "TOKEN_MOVE_3D", callsign: selectedToken };
                msg[activeAxisMode.a1] = snapVal1;
                msg[activeAxisMode.a2] = snapVal2;
                ws.send(JSON.stringify(msg));
            } else if (isDraggingCam) {
                const deltaX = e.clientX - lastMousePos.x;
                const deltaY = e.clientY - lastMousePos.y;
                camYaw += deltaX * 0.007;
                camPitch -= deltaY * 0.007;
                
                const pi2 = Math.PI * 2;
                camYaw = (camYaw % pi2 + pi2) % pi2;
                camPitch = (camPitch % pi2 + pi2) % pi2;
                
                lastMousePos = { x: e.clientX, y: e.clientY };
            }
        }

        mXY.addEventListener('mousedown', (e) => handleMiniMouseDown(e, mXY, 'x', 'y', false, true));
        mXZ.addEventListener('mousedown', (e) => handleMiniMouseDown(e, mXZ, 'x', 'z', false, true));
        mYZ.addEventListener('mousedown', (e) => handleMiniMouseDown(e, mYZ, 'y', 'z', false, true));

        function wireCameraDragElement(el) {
            el.addEventListener('mousedown', (e) => {
                isDraggingCam = true;
                lastMousePos = { x: e.clientX, y: e.clientY };
            });
        }
        wireCameraDragElement(canvas3D);
        wireCameraDragElement(mCam);

        window.addEventListener('mousemove', trackMouseMoves);
        window.addEventListener('mouseup', () => { selectedToken = null; activeAxisMode = null; isDraggingCam = false; });
         function project3DTo2D(x, y, z) {
            let cosY = Math.cos(camYaw), sinY = Math.sin(camYaw);
            let cosP = Math.cos(camPitch), sinP = Math.sin(camPitch);

            let x1 = x * cosY - y * sinY;
            let y1 = x * sinY + y * cosY;

            let z2 = z * cosP - y1 * sinP;
            let y2 = z * sinP + y1 * cosP;

            const fovScale = 450; 
            const distance = 600;
            const screenX = (canvas3D.width / 2) + (x1 * (fovScale / (y2 + distance)));
            const screenY = (canvas3D.height / 2) - (z2 * (fovScale / (y2 + distance)));

            return { x: screenX, y: screenY, depth: y2 };
        }

        // FIXED: Reads sequential indices correctly to draw a link from vertex A to vertex B
        function drawShipMeshLines(ctx, pts, links) {
            for (let i = 0; i < links.length; i += 2) {
                let idx1 = links[i];
                let idx2 = links[i + 1];
                let p1 = pts[idx1];
                let p2 = pts[idx2];
                if (p1 && p2) {
                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.stroke();
                }
            }
        }

        function drawCustomWireframeShip(ctx, node, centerPt) {
            const sizeMap = { "SMALL": 10, "MEDIUM": 30, "LARGE": 50 };
            const r = (sizeMap[node.meta.size] || 30) / 2;
            const shape = node.meta.shape || "BOX";
            
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = ctx.fillStyle;

            let vertices = [];
            let cx = fleetAssignments[node.callsign].x;
            let cy = fleetAssignments[node.callsign].y;
            let cz = fleetAssignments[node.callsign].z;

            if (shape === "WEDGE") {
                vertices = [
                    project3DTo2D(cx, cy + r, cz),         // 0: Tip
                    project3DTo2D(cx - r, cy - r, cz - r), // 1: Back Left Bottom
                    project3DTo2D(cx + r, cy - r, cz - r), // 2: Back Right Bottom
                    project3DTo2D(cx - r, cy - r, cz + r), // 3: Back Left Top
                    project3DTo2D(cx + r, cy - r, cz + r)  // 4: Back Right Top
                ];
                const wedgeStr = "0-1-0-2-0-3-0-4-1-2-1-3-2-4-3-4";
                const wedgeIndices = wedgeStr.split("-").map(Number);
                drawShipMeshLines(ctx, vertices, wedgeIndices);

            } else if (shape === "ARROW") {
                vertices = [
                    project3DTo2D(cx, cy + r, cz),         // 0: Front
                    project3DTo2D(cx - r, cy - r, cz),     // 1: Left Wing
                    project3DTo2D(cx, cy - r/2, cz),       // 2: Tail Inner
                    project3DTo2D(cx + r, cy - r, cz),     // 3: Right Wing
                    project3DTo2D(cx, cy, cz + r/2),       // 4: Dorsal Fin
                    project3DTo2D(cx, cy, cz - r/2)        // 5: Ventral Fin
                ];
                const arrowStr = "0-1-0-3-1-2-3-2-0-4-2-4-0-5-2-5";
                const arrowIndices = arrowStr.split("-").map(Number);
                drawShipMeshLines(ctx, vertices, arrowIndices);

            } else { // Standard Block Voxel Box
                for (let dx of [-r, r]) {
                    for (let dy of [-r, r]) {
                        for (let dz of [-r, r]) {
                            vertices.push(project3DTo2D(cx + dx, cy + dy, cz + dz));
                        }
                    }
                }
                const boxStr = "0-1-1-3-3-2-2-0-4-5-5-7-7-6-6-4-0-4-1-5-2-6-3-7";
                const boxIndices = boxStr.split("-").map(Number);
                drawShipMeshLines(ctx, vertices, boxIndices);
            }
            ctx.shadowBlur = 0;
        }


        function renderMiniOrthographicHUD(ctx, cEl, axis1, axis2, inv1, inv2) {
            ctx.clearRect(0, 0, cEl.width, cEl.height);
            const mX = cEl.width / 2; const mY = cEl.height / 2;

            // HIGH CONTRAST UPDATE: Fetches the custom color picker values directly for the mini-map lines
            const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--grid-color').trim();
            ctx.strokeStyle = gridColor; 
            ctx.lineWidth = 1;
            
            for (let g = -200; g <= 200; g += 100) {
                let coord = g * ORTHO_SCALE;
                ctx.beginPath(); ctx.moveTo(mX + coord, 0); ctx.lineTo(mX + coord, cEl.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, mY + coord); ctx.lineTo(cEl.width, mY + coord); ctx.stroke();
            }

            ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--hud-color').trim();
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(mX, 0); ctx.lineTo(mX, cEl.height); ctx.moveTo(0, mY); ctx.lineTo(cEl.width, mY); ctx.stroke();

            const leadColor = getComputedStyle(document.documentElement).getPropertyValue('--lead-color').trim();
            const escortColor = getComputedStyle(document.documentElement).getPropertyValue('--hud-color').trim();

            for (const [callsign, tData] of Object.entries(targetAssignments)) {
                if (!fleetAssignments[callsign]) continue;
                
                fleetAssignments[callsign][axis1] += (tData[axis1] - fleetAssignments[callsign][axis1]) * 0.15;
                fleetAssignments[callsign][axis2] += (tData[axis2] - fleetAssignments[callsign][axis2]) * 0.15;

                let val1 = inv1 ? -fleetAssignments[callsign][axis1] : fleetAssignments[callsign][axis1];
                let val2 = inv2 ? -fleetAssignments[callsign][axis2] : fleetAssignments[callsign][axis2];

                const curX = mX + (val1 * ORTHO_SCALE);
                const curY = mY + (val2 * ORTHO_SCALE);

                ctx.fillStyle = tData.slot === "Lead" ? leadColor : escortColor;
                ctx.beginPath(); ctx.arc(curX, curY, 5, 0, 2 * Math.PI); ctx.fill();
                
                ctx.fillStyle = "#ffffff"; ctx.font = "8px sans-serif";
                ctx.fillText(callsign, curX + 7, curY + 3);
            }
        }
        function drawMasterFrameEngine() {
            ctx3D.clearRect(0, 0, canvas3D.width, canvas3D.height);

            renderMiniOrthographicHUD(ctxXY, mXY, 'x', 'y', false, true);
            renderMiniOrthographicHUD(ctxXZ, mXZ, 'x', 'z', false, true);
            renderMiniOrthographicHUD(ctxYZ, mYZ, 'y', 'z', false, true);

            ctxCam.clearRect(0, 0, mCam.width, mCam.height);
            ctxCam.fillStyle = "#ffffff"; ctxCam.font = "9px monospace";
            ctxCam.fillText("YAW: " + camYaw.toFixed(2) + " rad", 10, 15);
            ctxCam.fillText("PITCH: " + camPitch.toFixed(2) + " rad", 10, 30);

            const currentGridColor = getComputedStyle(document.documentElement).getPropertyValue('--grid-color').trim();
            const currentLeadColor = getComputedStyle(document.documentElement).getPropertyValue('--lead-color').trim();
            const currentEscortColor = getComputedStyle(document.documentElement).getPropertyValue('--escort-color').trim();

            // TRUE 3D VOLUMETRIC GRID MATRIX CARES ENGINE LOOP
            ctx3D.lineWidth = 1;
            const gridAltitudes = [-100, 0, 100];
            gridAltitudes.forEach(altZ => {
                ctx3D.strokeStyle = altZ === 0 ? currentGridColor : "rgba(26, 61, 84, 0.25)";
                for (let g = -200; g <= 200; g += 100) {
                    let pStart1 = project3DTo2D(g, -200, altZ);
                    let pEnd1 = project3DTo2D(g, 200, altZ);
                    ctx3D.beginPath(); ctx3D.moveTo(pStart1.x, pStart1.y); ctx3D.lineTo(pEnd1.x, pEnd1.y); ctx3D.stroke();
                    
                    let pStart2 = project3DTo2D(-200, g, altZ);
                    let pEnd2 = project3DTo2D(200, g, altZ);
                    ctx3D.beginPath(); ctx3D.moveTo(pStart2.x, pStart2.y); ctx3D.lineTo(pEnd2.x, pEnd2.y); ctx3D.stroke();
                }
            });

            ctx3D.strokeStyle = "rgba(255, 255, 255, 0.02)";
            for (let gx = -200; gx <= 200; gx += 100) {
                for (let gy = -200; gy <= 200; gy += 100) {
                    let vStart = project3DTo2D(gx, gy, -100);
                    let vEnd = project3DTo2D(gx, gy, 100);
                    ctx3D.beginPath(); ctx3D.moveTo(vStart.x, vStart.y); ctx3D.lineTo(vEnd.x, vEnd.y); ctx3D.stroke();
                }
            }

            const chevronDistances = [60, 120, 180];
            ctx3D.strokeStyle = "rgba(255, 0, 85, 0.3)";
            ctx3D.lineWidth = 2;
            chevronDistances.forEach(dist => {
                let tip = project3DTo2D(0, dist, 0);
                let leftWing = project3DTo2D(-15, dist - 15, 0);
                let rightWing = project3DTo2D(15, dist - 15, 0);
                ctx3D.beginPath(); ctx3D.moveTo(leftWing.x, leftWing.y); ctx3D.lineTo(tip.x, tip.y); ctx3D.lineTo(rightWing.x, rightWing.y); ctx3D.stroke();
            });

            let frontLabelPt = project3DTo2D(0, 220, 0);
            ctx3D.fillStyle = currentLeadColor; ctx3D.font = "bold 9px monospace";
            ctx3D.fillText("▲ FORWARD VECTOR (FORE)", frontLabelPt.x - 60, frontLabelPt.y);

            let depthSortPool = [];
            let countShips = 0;

            for (const [callsign, tData] of Object.entries(targetAssignments)) {
                countShips++;
                let currentPos = fleetAssignments[callsign] || tData;
                let projection = project3DTo2D(currentPos.x, currentPos.y, currentPos.z);
                depthSortPool.push({ callsign: callsign, proj: projection, meta: tData });
            }
            document.getElementById('ui-count').innerText = countShips;

            depthSortPool.sort((a, b) => b.proj.depth - a.proj.depth);

            depthSortPool.forEach(node => {
                const screenPt = node.proj;
                const hullColor = node.meta.slot === "Lead" ? currentLeadColor : currentEscortColor;
                
                let baseAnchor = project3DTo2D(fleetAssignments[node.callsign].x, fleetAssignments[node.callsign].y, 0);
                ctx3D.strokeStyle = "rgba(255, 255, 255, 0.08)";
                ctx3D.beginPath(); ctx3D.moveTo(baseAnchor.x, baseAnchor.y); ctx3D.lineTo(screenPt.x, screenPt.y); ctx3D.stroke();

                ctx3D.fillStyle = hullColor;
                ctx3D.strokeStyle = hullColor;
                drawCustomWireframeShip(ctx3D, node, screenPt);

                ctx3D.fillStyle = "#ffffff"; ctx3D.font = "bold 11px sans-serif";
                ctx3D.fillText(node.callsign + " [" + node.meta.ship + "]", screenPt.x + 16, screenPt.y - 3);
                
                ctx3D.fillStyle = "#888888"; ctx3D.font = "9px sans-serif";
                ctx3D.fillText("X:" + Math.round(fleetAssignments[node.callsign].x) + " Y:" + Math.round(fleetAssignments[node.callsign].y) + " Z:" + Math.round(fleetAssignments[node.callsign].z) + "m", screenPt.x + 16, screenPt.y + 9);
            });

            requestAnimationFrame(drawMasterFrameEngine);
        }

        requestAnimationFrame(drawMasterFrameEngine);
    </script>
</body>
</html>
